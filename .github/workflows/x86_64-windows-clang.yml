name: Clang X86_64 Windows

on:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            cmake
            make
            pkgconf
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-ninja
            python3
            python3-pip

      - name: Install Python dependencies
        shell: msys2 {0}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kconfiglib kbuild

      - name: Build
        shell: msys2 {0}
        run: |
          cd bootstrap

          mkdir -p build
          cd build

          cmake .. \
            -G "Ninja" \
            -DARCH=native \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

          cmake --build . --verbose