name: GCC i686 Windows

on:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-cmake
            make
            pkgconf
            mingw-w64-i686-gcc
            mingw-w64-i686-ninja
            python3
            python3-pip

      - name: Install Python dependencies
        shell: msys2 {0}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kconfiglib kbuild

      - name: Build
        shell: msys2 {0}
        run: |
          cd bootstrap

          mkdir -p build
          cd build

          cmake .. \
            -G "Ninja" \
            -DARCH=native \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++

          cmake --build . --verbose