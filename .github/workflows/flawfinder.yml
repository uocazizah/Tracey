# separate terms of service, privacy policy, and support
# documentation.

name: flawfinder

on:
  push:
    branches: [ "master" ]
  pull_request:
  schedule:
    - cron: '41 22 * * 1'

jobs:
  flawfinder:
    name: Flawfinder
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: flawfinder_scan
        uses: david-a-wheeler/flawfinder@2.0.20
        with:
          arguments: "--minlevel=2 --falsepositive --context --columns --sarif --exclude '*/dependencies/*' --exclude '*/bootstrap/dependencies/*' ./"
          output: 'flawfinder_results.sarif'

      - name: Filter out note-level (rank=0) results
        run: |
          python3 -c "
          import json, os
          with open('flawfinder_results.sarif') as f:
              data = json.load(f)
          filtered_runs = []
          for run in data.get('runs', []):
              results = run.get('results', [])
              filtered = [r for r in results if r.get('rank', 0) > 0]
              if filtered:
                  run['results'] = filtered
                  filtered_runs.append(run)
          data['runs'] = filtered_runs
          if os.path.exists('flawfinder_results.sarif'):
              os.remove('flawfinder_results.sarif')
          with open('flawfinder_results.sarif', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload analysis results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ${{github.workspace}}/flawfinder_results.sarif
