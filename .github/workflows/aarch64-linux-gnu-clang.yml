name: Clang AArch64 Linux GNU

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            cmake \
            pkg-config

      - name: Build
        run: |
          cd bootstrap
          mkdir -p build && cd build

          cmake .. -DARCH=native \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

          cmake --build . --verbose
