name: Apple Clang macOS Intel

on:
  pull_request:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          brew update
          brew install cmake pkg-config

      - name: Show environment
        run: |
          uname -a
          uname -m
          clang --version

      - name: Build and test
        run: |
          cd bootstrap
          mkdir -p build
          cd build

          cmake .. \
            -DARCH=native \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

          cmake --build . --verbose
