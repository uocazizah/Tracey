name: Build

on:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x86_64 (native) ---
          - name: GCC x86_64 Linux GNU
            runs_on: ubuntu-latest
            packages: build-essential gcc gcc-14 pkg-config python3-pip
            cc: gcc-14
            cflags: ""
            cross: "false"
            cross_arch: ""
            run_smoke: "true"

          - name: Clang x86_64 Linux GNU
            runs_on: ubuntu-latest
            packages: clang-18 llvm-18 pkg-config python3-pip
            cc: clang-18
            cflags: ""
            cross: "false"
            cross_arch: ""
            run_smoke: "true"

          # --- aarch64 (native on ARM runner) ---
          - name: GCC AArch64 Linux GNU
            runs_on: ubuntu-24.04-arm
            packages: build-essential gcc-14 pkg-config python3-pip
            cc: gcc-14
            cflags: ""
            cross: "false"
            cross_arch: ""
            run_smoke: "true"

          - name: Clang AArch64 Linux GNU
            runs_on: ubuntu-24.04-arm
            packages: clang-18 llvm-18 pkg-config python3-pip
            cc: clang-18
            cflags: ""
            cross: "false"
            cross_arch: ""
            run_smoke: "true"

          # --- i686 (cross, cannot execute on host) ---
          - name: GCC i686 Linux GNU
            runs_on: ubuntu-latest
            packages: pkg-config gcc-i686-linux-gnu python3-pip
            cc: i686-linux-gnu-gcc
            cflags: ""
            cross: "true"
            cross_arch: i686
            run_smoke: "false"

          - name: Clang i686 Linux GNU
            runs_on: ubuntu-latest
            packages: clang-18 llvm-18 gcc-i686-linux-gnu pkg-config python3-pip
            cc: clang-18
            cflags: "--target=i686-linux-gnu"
            cross: "true"
            cross_arch: i686
            run_smoke: "false"

          # --- armhf (cross, cannot execute on host) ---
          - name: GCC ARMHF Linux GNU
            runs_on: ubuntu-24.04-arm
            packages: pkg-config gcc-arm-linux-gnueabihf python3-pip
            cc: arm-linux-gnueabihf-gcc
            cflags: ""
            cross: "true"
            cross_arch: arm
            run_smoke: "false"

          - name: Clang ARMHF Linux GNU
            runs_on: ubuntu-24.04-arm
            packages: pkg-config clang-18 llvm-18 gcc-arm-linux-gnueabihf python3-pip
            cc: clang-18
            cflags: "--target=arm-linux-gnueabihf"
            cross: "true"
            cross_arch: arm
            run_smoke: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kconfiglib

      - name: Build
        run: |
          MAKE_ARGS=(CC="${{ matrix.cc }}")
          if [ -n "${{ matrix.cflags }}" ]; then
            MAKE_ARGS+=(CFLAGS="${{ matrix.cflags }}")
          fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            MAKE_ARGS+=(ARCH="${{ matrix.cross_arch }}")
          fi
          make "${MAKE_ARGS[@]}"

      - name: Run tests
        if: matrix.run_smoke == 'true'
        run: make test

      - name: Smoke test
        if: matrix.run_smoke == 'true'
        run: |
          ./build/traceyc bootstrap/index.trc
          ./build/traceyc --version
          ./build/traceyc --help
