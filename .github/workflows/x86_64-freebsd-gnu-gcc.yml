name: GCC x86_64 FreeBSD

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and Test on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.7
        with:
          sync: rsync
          copyback: false
          cpu: 1
          arch: x86_64
          sync-time: true
          disable-cache: false
          cache-after-prepare: false
          usesh: true

          prepare: |
            pkg update
            pkg install -y \
              gcc \
              gmake \
              cmake \
              pkgconf \
              python3

            python3 -m ensurepip

          run: |
            cd bootstrap

            rm -rf build
            mkdir build
            cd build

            python3 -m pip install \
              --break-system-packages \
              kconfiglib

            cmake .. \
              -DARCH=native \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_MAKE_PROGRAM=gmake

            cmake --build . --verbose
